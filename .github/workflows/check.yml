name: Desktop build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            targets: x86_64-pc-windows-msvc
            args: --bundles nsis
            installer: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            installer: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installer
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Verify and launch the Mac application
        if: runner.os == 'macOS'
        shell: bash
        run: python3 scripts/verify-macos.py
      - name: Stage installer and source manifest
        env:
          INSTALLER_PLATFORM: ${{ matrix.platform }}
          INSTALLER_GLOB: ${{ matrix.installer }}
        run: python3 scripts/stage-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: artifacts/installers/${{ matrix.platform }}/
          if-no-files-found: error

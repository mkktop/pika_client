name: Upload verified installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        type: string
      run_id:
        description: Successful Desktop build workflow run
        required: true
        type: string
      platform:
        description: Installer platform
        required: true
        default: windows-x64
        type: choice
        options: [windows-x64, macos-arm64]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      INSTALLER_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate the source build
        uses: actions/github-script@v7
        with:
          script: |
            const { findVerifiedRun } = require('./scripts/release-artifacts.cjs');
            await findVerifiedRun({ github, context, tag: process.env.RELEASE_TAG, runId: process.env.BUILD_RUN_ID });
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.platform }}-installer
          path: installers/${{ inputs.platform }}-installer
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and upload to release draft
        uses: actions/github-script@v7
        with:
          script: |
            const { uploadInstallers } = require('./scripts/release-artifacts.cjs');
            await uploadInstallers({ github, context, core, tag: process.env.RELEASE_TAG,
              directory: 'installers', platforms: [process.env.INSTALLER_PLATFORM] });
